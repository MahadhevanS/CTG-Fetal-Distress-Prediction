# Model 8 Configuration: Knowledge-Infused Multi-Task Framework
# =============================================================
# Phase 4 training configuration for the KnowledgeInfusedFramework.
# Backbone: PatchTSTEncoder with tuned hyperparameters (from configs/tuned_hyperparameters.yaml).
# All lambda values are starting points; tune by sweeping on validation AUROC.

# -------------------------------------------------------------------
# Backbone: PatchTST Encoder (tuned config — SOTA winner from Phase 3)
# -------------------------------------------------------------------
backbone:
  model: patchtst
  in_channels: 2
  seq_len: 4800
  patch_len: 16
  stride: 16        # non-overlapping patches; overlapping (stride=8) underperformed in tuning
  d_model: 128
  n_heads: 4        # tuned (model default: 8); d_head = 32
  n_layers: 4       # tuned (model default: 3); deeper = stronger temporal representation
  d_ff: 512         # feedforward expansion ratio = 4x d_model
  dropout: 0.2
  latent_dim: 128

# -------------------------------------------------------------------
# Multi-Task Heads
# -------------------------------------------------------------------
heads:
  hidden_dim: 64    # shared MLP hidden dim for all 3 heads
  dropout: 0.2      # shared dropout rate for all 3 heads

# -------------------------------------------------------------------
# Training Protocol
# -------------------------------------------------------------------
training:
  epochs: 50
  batch_size: 64      # tuned PatchTST batch size
  lr: 0.0001          # tuned PatchTST learning rate
  weight_decay: 0.0001
  k_folds: 5          # stratified patient-level cross-validation folds
  gradient_clip: 1.0  # max gradient norm for clipping (applied after backward)
  scheduler: cosine   # CosineAnnealingLR with T_max = epochs
  optimizer: adamw

# -------------------------------------------------------------------
# Loss Weights (Multi-Task Balancing)
# -------------------------------------------------------------------
# L_total = L_distress + lambda_figo * L_FIGO + lambda_features * L_features
#           + lambda_knowledge * L_knowledge
#
# Starting values selected based on:
#   - L_distress is primary — other terms act as regularizers (weights < 1.0)
#   - L_FIGO (3-class CE) carries clear supervised signal → moderate weight
#   - L_features (8-feature MSE) has higher variance → lower weight
#   - L_knowledge (soft FIGO rule penalty) is unsupervised → lowest weight
#
# Tuning guide: start here, then sweep on validation fold AUROC:
#   lambda_figo:      [0.1, 0.2, 0.3, 0.5]
#   lambda_features:  [0.05, 0.1, 0.2, 0.3]
#   lambda_knowledge: [0.05, 0.1, 0.2]
loss:
  lambda_figo: 0.3
  lambda_features: 0.2
  lambda_knowledge: 0.1
  lambda_consistency: 0.5  # internal weight inside figo_rule_loss_normalized()

# -------------------------------------------------------------------
# Ablation Variants
# Run with: --ablation [distress_only | plus_figo | plus_features | full]
# -------------------------------------------------------------------
# distress_only:  L = L_distress only                    (Model 7 baseline reproduction)
# plus_figo:      L = L_distress + lambda_figo*L_FIGO
# plus_features:  L = L_distress + lambda_figo*L_FIGO + lambda_features*L_features
# full:           L = L_distress + lambda_figo*L_FIGO + lambda_features*L_features
#                   + lambda_knowledge*L_knowledge        (complete Model 8)
ablation_variants:
  - distress_only
  - plus_figo
  - plus_features
  - full

# -------------------------------------------------------------------
# Paths
# -------------------------------------------------------------------
paths:
  data_dir: data/processed/
  # Feature scaler: should contain 'feature_means' and 'feature_stds' arrays (shape (8,))
  # Generated by preprocessing pipeline when computing y_features targets.
  # Falls back to identity transform (means=0, stds=1) if not found.
  feature_scaler_path: data/processed/feature_scaler.npz
  checkpoint_dir: checkpoints/model8/
  results_dir: checkpoints/model8/results/
