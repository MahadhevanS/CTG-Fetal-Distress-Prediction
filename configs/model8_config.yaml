# Model 8 Configuration: Knowledge-Infused Multi-Task Framework
# =============================================================
# Phase 4+ enhanced training configuration for the KnowledgeInfusedFramework.
# Backbone: PatchTSTEncoder with tuned hyperparameters (from configs/tuned_hyperparameters.yaml).
# All lambda values are starting points; tune by sweeping on validation AUROC.
#
# NEW in Phase 4+:
#   - loss_weighting: dynamic multi-task loss balancing (uncertainty/dwa/gradnorm/fixed)
#   - scheduler: warmup + cosine or onecycle
#   - ema: exponential moving average of weights for validation
#   - swa: stochastic weight averaging at end of fold
#   - sampling: balanced batches and hard example mining
#   - augmentation: physiologically safe CTG signal augmentation
#   - calibration: threshold optimization and temperature scaling
#   - curriculum: progressive task inclusion schedule
#   - ablation_extended: 6-variant expanded ablation study

# -------------------------------------------------------------------
# Backbone: PatchTST Encoder (tuned config — SOTA winner from Phase 3)
# -------------------------------------------------------------------
backbone:
  model: patchtst
  in_channels: 2
  seq_len: 4800
  patch_len: 16
  stride: 16        # non-overlapping patches; overlapping (stride=8) underperformed in tuning
  d_model: 128
  n_heads: 4        # tuned (model default: 8); d_head = 32
  n_layers: 4       # tuned (model default: 3); deeper = stronger temporal representation
  d_ff: 512         # feedforward expansion ratio = 4x d_model
  dropout: 0.2
  latent_dim: 128

# -------------------------------------------------------------------
# Multi-Task Heads
# -------------------------------------------------------------------
heads:
  hidden_dim: 64    # shared MLP hidden dim for all 3 heads
  dropout: 0.2      # shared dropout rate for all 3 heads

# -------------------------------------------------------------------
# Training Protocol
# -------------------------------------------------------------------
training:
  epochs: 50
  batch_size: 64      # tuned PatchTST batch size
  lr: 0.0001          # tuned PatchTST learning rate
  weight_decay: 0.0001
  k_folds: 5          # stratified patient-level cross-validation folds
  gradient_clip: 1.0  # max gradient norm for clipping (applied after backward)
  optimizer: adamw

# -------------------------------------------------------------------
# Learning Rate Scheduler (NEW in Phase 4+)
# -------------------------------------------------------------------
scheduler:
  type: warmup_cosine   # Options: 'cosine' (original), 'warmup_cosine', 'onecycle'
  warmup_epochs: 5      # Linear warmup for first N epochs (only for warmup_cosine)
  eta_min: 1.0e-6       # Minimum LR at end of cosine decay
  # OneCycleLR params (only used when type: onecycle):
  onecycle_max_lr: 0.001
  onecycle_pct_start: 0.3   # Fraction of cycle spent increasing LR

# -------------------------------------------------------------------
# Loss Weights (Multi-Task Balancing)
# -------------------------------------------------------------------
# L_total = L_distress + lambda_figo * L_FIGO + lambda_features * L_features
#           + lambda_knowledge * L_knowledge
#
# Starting values — these are used by FixedWeighting.
# Dynamic methods (uncertainty/dwa/gradnorm) learn their own weights.
loss:
  lambda_figo: 0.3
  lambda_features: 0.2
  lambda_knowledge: 0.1
  lambda_consistency: 0.5  # internal weight inside figo_rule_loss_normalized()

# -------------------------------------------------------------------
# Dynamic Loss Weighting (NEW in Phase 4+)
# -------------------------------------------------------------------
loss_weighting:
  method: fixed         # Options: 'fixed', 'uncertainty', 'dwa', 'gradnorm'
  # uncertainty params:
  uncertainty_init_log_sigma2: 0.0
  # dwa params:
  dwa_temperature: 2.0
  # gradnorm params:
  gradnorm_alpha: 1.5
  gradnorm_shared_layer: encoder

# -------------------------------------------------------------------
# EMA (Exponential Moving Average) — NEW in Phase 4+
# -------------------------------------------------------------------
ema:
  enabled: true
  decay: 0.9995         # Shadow weight decay rate (0.999–0.9999 typical range)
  use_for_validation: true  # If true, validation uses EMA weights

# -------------------------------------------------------------------
# SWA (Stochastic Weight Averaging) — NEW in Phase 4+
# -------------------------------------------------------------------
swa:
  enabled: true
  max_checkpoints: 10   # Max checkpoint snapshots to average per fold
  start_epoch: 30       # Begin collecting snapshots from this epoch
  evaluate_swa: true    # Also evaluate SWA model at fold end

# -------------------------------------------------------------------
# Batch Sampling Strategy — NEW in Phase 4+
# -------------------------------------------------------------------
sampling:
  method: balanced      # Options: 'default' (original), 'balanced', 'hard_mining'
  # Hard Example Mining params (active when method: hard_mining):
  hard_mining_warmup_epochs: 5    # Epochs before mining activates
  hard_mining_ema_decay: 0.9      # Per-sample loss EMA decay
  hard_mining_hard_ratio: 0.6     # 60% batch weight from hard examples

# -------------------------------------------------------------------
# Curriculum Training — NEW in Phase 4+
# -------------------------------------------------------------------
# Progressively introduces auxiliary tasks to stabilize early training.
# Each entry: [start_epoch, ablation_variant]
# Example: epochs 0–4 = distress only, epoch 5+ = full multi-task
curriculum:
  enabled: false        # Set to true to enable curriculum schedule
  schedule:
    - [0, "distress_only"]
    - [5, "plus_features"]
    - [10, "full"]

# -------------------------------------------------------------------
# Physiological Signal Augmentation — NEW in Phase 4+
# -------------------------------------------------------------------
augmentation:
  enabled: true
  p: 0.5                  # Global probability of augmenting each sample
  noise_std: 0.02         # Gaussian noise std (normalized units)
  drift_max_amp: 0.05     # Max baseline drift amplitude (normalized units)
  scale_range: [0.97, 1.03]   # Multiplicative scaling range (±3%)
  jitter_max: 5           # Max temporal shift in samples (5 samples = 1.25 s)
  missing_max_ratio: 0.03 # Max fraction of signal to zero out (3%)
  missing_block_max: 48   # Max contiguous block to zero (48 samples = 12 s)

# -------------------------------------------------------------------
# Calibration — NEW in Phase 4+
# -------------------------------------------------------------------
calibration:
  optimize_threshold: true            # Search for optimal decision threshold per fold
  threshold_objective: f1             # Options: 'f1', 'sens_at_90spec', 'balanced_f1'
  temperature_scaling: true           # Fit temperature scaler and report ECE/Brier Score
  report_calibration_metrics: true

# -------------------------------------------------------------------
# Ablation Variants (original 4 + 2 extended)
# Run with: --ablation [distress_only | plus_figo | plus_features | full |
#                        distress_features_only | distress_figo_only]
# -------------------------------------------------------------------
ablation_variants:
  - distress_only           # A: L_distress only (baseline reproduction)
  - plus_figo               # B: + L_FIGO
  - distress_features_only  # C: + L_features (no FIGO head)
  - plus_features           # D: + L_FIGO + L_features
  - distress_figo_only      # E: + L_FIGO + L_knowledge (no feature regression)
  - full                    # E: + L_FIGO + L_features + L_knowledge (complete Model 8)

# -------------------------------------------------------------------
# Error Analysis — NEW in Phase 4+
# -------------------------------------------------------------------
error_analysis:
  enabled: true
  save_per_fold: true   # Save JSON report per fold
  results_dir: checkpoints/model8/results/error_analysis/

# -------------------------------------------------------------------
# Paths
# -------------------------------------------------------------------
paths:
  data_dir: data/processed/
  # Feature scaler: should contain 'feature_means' and 'feature_stds' arrays (shape (8,))
  # Generated by preprocessing pipeline when computing y_features targets.
  # Falls back to identity transform (means=0, stds=1) if not found.
  feature_scaler_path: data/processed/feature_scaler.npz
  checkpoint_dir: checkpoints/model8/
  results_dir: checkpoints/model8/results/
  horizon_analysis_dir: checkpoints/model8/results/horizon_analysis/
